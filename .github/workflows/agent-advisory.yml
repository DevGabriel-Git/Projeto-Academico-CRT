name: Manual OpenAI advisory review
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prepare:
    name: Review last commit with OpenAI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 2
      - name: Prepare data for human review
        run: |
          mkdir -p reports/review
          git rev-parse --verify HEAD^ > /dev/null
          git log -1 --format='%H%n%s' > reports/review/context.md
          git show --no-ext-diff --format= HEAD > reports/review/change.diff
      - name: Reject secrets before preparing artifact
        run: docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.30.1 dir /repo/reports/review --config /repo/security-policy/gitleaks.toml --redact
      - name: Request bounded advisory review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 scripts/openai_ci_review.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: review-packet-for-repository-maintainer
          path: reports/review
          if-no-files-found: error
          retention-days: 7
