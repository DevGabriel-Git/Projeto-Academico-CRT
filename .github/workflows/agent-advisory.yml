name: Prepare human review packet
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prepare:
    name: Prepare review artifact without an external model
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Prepare data for human review
        run: |
          mkdir -p reports/review
          git log -1 --format='%H%n%s' > reports/review/context.md
          git show --no-ext-diff --format= HEAD > reports/review/change.diff
      - name: Reject secrets before preparing artifact
        run: docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.30.1 dir /repo/reports/review --config /repo/security-policy/gitleaks.toml --redact
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: review-packet-for-repository-maintainer
          path: reports/review
          if-no-files-found: error
