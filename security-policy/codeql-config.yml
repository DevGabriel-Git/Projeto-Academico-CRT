name: Corretora security
queries:
  - uses: security-extended
  - uses: security-and-quality
paths-ignore:
  # Apenas dependências, build e relatórios gerados.
  - '**/node_modules/**'
  - '**/target/**'
  - '**/dist/**'
  - '**/.angular/**'
  # Ferramentas locais e skills vendorizadas nao integram o produto publicado.
  - '**/.tools/**'
  - '.agents/skills/**'

# Todo o codigo executavel do produto; ferramentas ficam fora da extracao JS.
paths:
  - src
  - corretora-frontend/src
