spring.application.name=CorretoraAcademico

brapi.token=${BRAPI_TOKEN}

alphavantage.key=${ALPHAVANTAGE_KEY}

twelvedata.key=${TWELVEDATA_KEY}

jwt.secret=${JWT_SECRET}

spring.datasource.url=jdbc:postgresql://localhost:5432/corretora

spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.username=${DB_USER}

spring.datasource.password=${DB_PASSWORD}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=validate

spring.jpa.open-in-view=false

spring.h2.console.enabled=false

management.endpoints.web.exposure.include=health,info,prometheus

management.endpoint.health.show-details=never

management.endpoint.health.probes.enabled=true

management.metrics.distribution.percentiles-histogram.http.server.requests=true

spring.cloud.openfeign.client.config.default.connectTimeout=3000

spring.cloud.openfeign.client.config.default.readTimeout=5000

server.error.include-message=never

server.error.include-stacktrace=never
