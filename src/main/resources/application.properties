spring.application.name=CorretoraAcademico

# Must match the patched WebJar version in pom.xml so resource resolution stays valid.
springdoc.swagger-ui.version=5.34.1

brapi.token=${BRAPI_TOKEN}

alphavantage.key=${ALPHAVANTAGE_KEY}

twelvedata.key=${TWELVEDATA_KEY}

jwt.secret=${JWT_SECRET}

spring.datasource.url=jdbc:postgresql://localhost:5432/corretora

spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.username=${DB_USER}

spring.datasource.password=${DB_PASSWORD}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=validate

spring.jpa.open-in-view=false

spring.h2.console.enabled=false

# Prometheus is required and JWT-protected; scoped triage: docs/security-actuator.md.
# nosemgrep: java.spring.security.audit.spring-actuator-non-health-enabled.spring-actuator-dangerous-endpoints-enabled
management.endpoints.web.exposure.include=health,prometheus

management.endpoint.health.show-details=never

management.endpoint.health.probes.enabled=true

management.metrics.distribution.percentiles-histogram.http.server.requests=true

spring.cloud.openfeign.client.config.default.connectTimeout=3000

spring.cloud.openfeign.client.config.default.readTimeout=5000

server.error.include-message=never

server.error.include-stacktrace=never

management.tracing.sampling.probability=${TRACING_SAMPLE_RATE:0.1}

management.otlp.metrics.export.enabled=false
